<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e3a5f">
<title>TradeCal 交易日历</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
         background: #f1f5f9; color: #0f172a; padding-bottom: 50px; }
  header { background: linear-gradient(135deg, #1e3a5f, #2563eb); color: #fff;
           padding: 16px; position: sticky; top: 0; z-index: 100;
           box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  header h1 { font-size: 18px; }
  header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 12px; }

  /* tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
  .tab { background: #fff; border: none; border-radius: 20px; padding: 8px 16px;
         font-size: 13px; font-weight: 600; cursor: pointer; color: #64748b;
         box-shadow: 0 1px 3px rgba(0,0,0,.08); white-space: nowrap; }
  .tab.active { background: #1e3a5f; color: #fff; }
  .tab .n { font-size: 11px; opacity: .7; margin-left: 4px; }

  /* market cards */
  .mkt { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card .label { font-size: 11px; color: #64748b; }
  .card .value { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .card .chg { font-size: 12px; margin-top: 2px; }
  .chg.up { color: #16a34a; } .chg.down { color: #dc2626; }

  /* search */
  .search { display: flex; gap: 8px; margin-bottom: 12px; }
  .search input { flex: 1; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px;
                  font-size: 14px; outline: none; background: #fff; }
  .search input:focus { border-color: #2563eb; }
  .search select { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px;
                   font-size: 13px; background: #fff; color: #334155; }

  /* stock table */
  .panel { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { position: sticky; top: 0; background: #f8fafc; color: #475569; font-weight: 600;
             text-align: right; padding: 10px 10px; border-bottom: 2px solid #e2e8f0; cursor: pointer; white-space: nowrap; }
  thead th:first-child, thead th:nth-child(2) { text-align: left; }
  tbody td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; text-align: right; white-space: nowrap; }
  tbody td:first-child { text-align: left; font-weight: 600; color: #1e3a5f; }
  tbody td:nth-child(2) { text-align: left; color: #64748b; font-size: 12px; max-width: 140px;
                           overflow: hidden; text-overflow: ellipsis; }
  tr:hover td { background: #f8fafc; }
  .pct.up { color: #16a34a; font-weight: 600; }
  .pct.down { color: #dc2626; font-weight: 600; }
  .pct.flat { color: #94a3b8; }
  .sector-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px;
                background: #eef2ff; color: #4338ca; }

  /* sections (news, earnings, macro) */
  .section { margin-bottom: 16px; }
  .section h2 { font-size: 15px; color: #334155; margin: 0 0 8px 2px; display: flex; align-items: center; gap: 6px; }
  .section h2 .count { background: #2563eb; color: #fff; font-size: 11px; border-radius: 10px; padding: 1px 8px; }
  .list { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .item { display: flex; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; gap: 10px; }
  .item:last-child { border-bottom: none; }
  .item.soon { background: #fffbeb; }
  .date-box { min-width: 56px; text-align: center; }
  .date-box .d { font-size: 14px; font-weight: 700; color: #1e3a5f; }
  .date-box .dl { display: block; font-size: 10px; color: #94a3b8; }
  .date-box .sent { font-size: 18px; }
  .body { flex: 1; }
  .title { font-size: 13px; line-height: 1.4; }
  .tk { color: #2563eb; font-weight: 600; font-size: 12px; }
  .period { color: #94a3b8; font-size: 11px; }
  .note { font-size: 11px; color: #64748b; margin-top: 3px; line-height: 1.4; }
  .badge { display: inline-block; margin-top: 4px; font-size: 10px; padding: 1px 8px; border-radius: 10px; }
  .badge.ok { background: #dcfce7; color: #15803d; }
  .badge.warn { background: #fef9c3; color: #a16207; }
  .sent.bull { color: #16a34a; } .sent.bear { color: #dc2626; } .sent.neu { color: #94a3b8; }
  .tags { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .rel-tag { display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 8px;
             background: #e0e7ff; color: #4338ca; font-weight: 600; }
  .imp { display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 8px; font-weight: 600; }
  .imp-high { background: #fee2e2; color: #b91c1c; }
  .imp-med { background: #fef9c3; color: #a16207; }
  .imp-low { background: #f1f5f9; color: #64748b; }

  .loading { text-align: center; padding: 60px 0; color: #64748b; }
  .err { text-align: center; padding: 40px 16px; color: #dc2626; font-size: 13px; }
  footer { text-align: center; font-size: 11px; color: #94a3b8; padding: 14px; }
</style>
</head>
<body>
<header>
  <h1>📊 TradeCal 交易日历</h1>
  <div class="sub" id="sub">S&P500 · 纳斯达克100 · 财报 · 宏观 · 新闻</div>
</header>
<div class="wrap">
  <div class="mkt" id="mkt"></div>

  <div class="tabs" id="tabs"></div>

  <div class="search">
    <input id="q" type="search" placeholder="🔍 搜索股票代码或名称，如 NVDA / 英伟达 / 苹果">
    <select id="sector">
      <option value="">全部行业</option>
    </select>
  </div>

  <div class="panel" id="stockpanel">
    <div class="loading">加载中...</div>
  </div>

  <div class="section" id="sec-news"></div>
  <div class="section" id="sec-earn"></div>
  <div class="section" id="sec-macro"></div>
</div>
<footer>
  数据源：NASDAQ 官方 API / Yahoo Finance · 更新于 <span id="updated">-</span>
  <br>手机使用：浏览器菜单 → 添加到主屏幕
</footer>

<script>
const sentIcon = { bull: '📈', bear: '📉', neutral: '⚪' };
const sentCls = { bull: 'bull', bear: 'bear', neutral: 'neu' };
let ALL = null;        // full dataset
let view = 'ndx';      // current tab: ndx | sp500
let sortKey = 'change_pct';
let sortDir = -1;

function fmtPct(v) {
  if (v === null || v === undefined) return '<span class="pct flat">--</span>';
  const cls = v > 0 ? 'up' : (v < 0 ? 'down' : 'flat');
  const s = v > 0 ? '+' : '';
  return `<span class="pct ${cls}">${s}${v.toFixed(2)}%</span>`;
}

function mktCard(label, v, fmt) {
  if (!v) return `<div class="card"><div class="label">${label}</div><div class="value">--</div></div>`;
  const chg = v.change_pct || 0;
  const cls = chg >= 0 ? 'up' : 'down';
  const arrow = chg >= 0 ? '▲' : '▼';
  const val = fmt ? fmt(v.close) : v.close;
  return `<div class="card"><div class="label">${label}</div><div class="value">${val}</div>
          <div class="chg ${cls}">${arrow} ${Math.abs(chg).toFixed(2)}%</div></div>`;
}

function renderMarket(m) {
  document.getElementById('mkt').innerHTML =
    mktCard('纳斯达克100', m?.ndx, v => v.toLocaleString()) +
    mktCard('标普500', m?.spx, v => v.toLocaleString()) +
    mktCard('VIX', m?.vix) +
    mktCard('13周利率 %', m?.irx);
}

function renderTabs() {
  const ndxN = ALL.nasdaq100?.length || 0;
  const spN = ALL.sp500?.length || 0;
  document.getElementById('tabs').innerHTML = `
    <button class="tab ${view==='ndx'?'active':''}" onclick="setView('ndx')">🟦 纳斯达克100 <span class="n">${ndxN}</span></button>
    <button class="tab ${view==='sp500'?'active':''}" onclick="setView('sp500')">🟨 标普500 <span class="n">${spN}</span></button>`;
}

function sectorsOf() {
  const data = view === 'ndx' ? ALL.nasdaq100 : ALL.sp500;
  const set = new Set();
  (data || []).forEach(s => s.sector && set.add(s.sector));
  return [...set].sort();
}

function renderSectorOptions() {
  const sel = document.getElementById('sector');
  const cur = sel.value;
  const opts = sectorsOf().map(s => `<option value="${s}">${s}</option>`).join('');
  sel.innerHTML = '<option value="">全部行业</option>' + opts;
  sel.value = cur;
}

function setView(v) {
  view = v;
  renderTabs();
  renderSectorOptions();
  renderTable();
}

function setSort(key) {
  if (sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = -1; }
  renderTable();
}

function filtered() {
  const q = document.getElementById('q').value.trim().toUpperCase();
  const sec = document.getElementById('sector').value;
  const data = view === 'ndx' ? ALL.nasdaq100 : ALL.sp500;
  return (data || []).filter(s => {
    if (sec && s.sector !== sec) return false;
    if (q) {
      const cn = (s.cn_name || '').toUpperCase();
      const name = (s.name || '').toUpperCase();
      if (!s.ticker.toUpperCase().includes(q) && !name.includes(q) && !cn.includes(q)) return false;
    }
    return true;
  });
}

function renderTable() {
  const data = filtered();
  const sorters = {
    ticker: a => a.ticker,
    change_pct: a => (a.change_pct === null ? -9999 : a.change_pct),
    price: a => (a.price === null ? -1 : a.price),
    sector: a => (a.sector || ''),
  };
  data.sort((a, b) => {
    const va = sorters[sortKey](a), vb = sorters[sortKey](b);
    if (typeof va === 'string') return sortDir * va.localeCompare(vb);
    return sortDir * (va - vb);
  });
  const arrow = sortDir === -1 ? '▼' : '▲';
  const rows = data.map(s => {
    const display = s.cn_name || s.name || s.ticker;
    return `
    <tr>
      <td>${s.ticker}</td>
      <td title="${display}">${display}</td>
      <td>${fmtPct(s.change_pct)}</td>
      <td>${s.price !== null && s.price !== undefined ? '$' + s.price.toLocaleString() : '--'}</td>
      <td>${s.sector ? `<span class="sector-tag">${s.sector}</span>` : ''}</td>
    </tr>`;
  }).join('');
  document.getElementById('stockpanel').innerHTML = `
    <table>
      <thead><tr>
        <th onclick="setSort('ticker')">代码 ${sortKey==='ticker'?arrow:''}</th>
        <th>名称</th>
        <th onclick="setSort('change_pct')">涨跌幅 ${sortKey==='change_pct'?arrow:''}</th>
        <th onclick="setSort('price')">价格 ${sortKey==='price'?arrow:''}</th>
        <th onclick="setSort('sector')">行业 ${sortKey==='sector'?arrow:''}</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:#94a3b8">无匹配</td></tr>'}</tbody>
    </table>`;
}

function renderNews() {
  const news = ALL.news || [];
  const impactTxt = { high: '🔴 影响大', medium: '🟡 中等', low: '⚪ 一般' };
  const impactCls = { high: 'imp-high', medium: 'imp-med', low: 'imp-low' };
  const items = news.map(n => {
    const link = n.link ? `<a href="${n.link}" target="_blank" style="color:#2563eb">查看</a>` : '';
    const related = (n.related || []).map(r => `<span class="rel-tag">${r}</span>`).join(' ');
    const imp = n.impact ? `<span class="imp ${impactCls[n.impact] || 'imp-low'}">${impactTxt[n.impact] || n.impact}</span>` : '';
    return `<div class="item"><div class="date-box"><span class="sent ${sentCls[n.sentiment]}">${sentIcon[n.sentiment]}</span></div>
      <div class="body"><div class="title"><span class="tk">${n.ticker}</span> ${n.title}</div>
      <div class="tags">${related} ${imp}</div>
      <div class="note">${link}</div></div></div>`;
  }).join('');
  document.getElementById('sec-news').innerHTML =
    `<h2>📰 相关新闻（利好📈 / 利空📉 / 影响度）<span class="count">${news.length}</span></h2><div class="list">${items || '<div class="item"><div class="body">暂无</div></div>'}</div>`;
}

function renderEarnings() {
  const es = ALL.earnings_upcoming || [];
  const items = es.map(e => {
    const soon = e.soon ? ' soon' : '';
    const conf = e.confidence === 'confirmed' ? '已确认' : '预计';
    const cls = e.confidence === 'confirmed' ? 'ok' : 'warn';
    const dl = e.days_left === 0 ? '今天！' : (e.days_left > 0 ? `${e.days_left}天后` : `${-e.days_left}天前`);
    return `<div class="item${soon}"><div class="date-box"><span class="d">${e.date.slice(5).replace('-','/')}</span><span class="dl">${dl}</span></div>
      <div class="body"><div class="title"><b>${e.company}</b> <span class="tk">${e.ticker}</span> <span class="period">${e.period}</span></div>
      <div class="note">${e.note}</div><span class="badge ${cls}">${conf}</span></div></div>`;
  }).join('');
  document.getElementById('sec-earn').innerHTML =
    `<h2>📅 即将到来的财报 <span class="count">${es.length}</span></h2><div class="list">${items || ''}</div>`;
}

function renderMacro() {
  const ms = ALL.macro_upcoming || [];
  const items = ms.map(m => {
    const soon = m.soon ? ' soon' : '';
    const icon = m.impact === 'high' ? '🔴' : '🟡';
    return `<div class="item${soon}"><div class="date-box"><span class="d">${m.date.slice(5).replace('-','/')}</span><span class="dl">${m.beijing_time}</span></div>
      <div class="body"><div class="title">${icon} <b>${m.event}</b></div><div class="note">${m.note || ''}</div></div></div>`;
  }).join('');
  document.getElementById('sec-macro').innerHTML =
    `<h2>🏛️ 宏观事件 <span class="count">${ms.length}</span></h2><div class="list">${items || ''}</div>`;
}

function renderAll() {
  document.getElementById('updated').textContent = ALL.generated_at || '-';
  document.getElementById('sub').textContent = `S&P500 · 纳斯达克100 · 更新于 ${ALL.generated_at || ''}`;
  renderMarket(ALL.market);
  renderTabs();
  renderSectorOptions();
  renderTable();
  renderNews();
  renderEarnings();
  renderMacro();
}

document.getElementById('q').addEventListener('input', renderTable);
document.getElementById('sector').addEventListener('change', renderTable);

fetch('data.json?v=' + Date.now())
  .then(r => r.json())
  .then(d => { ALL = d; renderAll(); })
  .catch(e => {
    document.getElementById('stockpanel').innerHTML =
      `<div class="err">数据加载失败：${e}<br>首次部署后需等 Actions 运行一次生成数据</div>`;
  });
</script>
</body>
</html>
